<!-- Mobile top bar (visible only on mobile) -->
<div class="mobile-bar">
  <div class="nav-logo">
    <div class="nav-logo-mark"></div>
    <div class="nav-logo-text">CRIMSON<br>MOONFLARE</div>
  </div>
  <button class="hamburger" (click)="toggle()" [class.active]="isOpen()" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</div>

<!-- Overlay (mobile — click to close) -->
@if (isOpen()) {
  <div class="nav-overlay" (click)="close()"></div>
}

<!-- Sidebar nav -->
<nav [class.open]="isOpen()">
  <div class="nav-logo nav-logo-sidebar">
    <div class="nav-logo-mark"></div>
    <div class="nav-logo-text">CRIMSON<br>MOONFLARE</div>
  </div>

  <ul>
    <li routerLinkActive="active"><a routerLink="/home"    (click)="close()">Home</a></li>
    <li routerLinkActive="active"><a routerLink="/bio"     (click)="close()">Who We Are</a></li>
    <li routerLinkActive="active"><a routerLink="/live"    (click)="close()">Live</a></li>
    <li routerLinkActive="active"><a routerLink="/music"   (click)="close()">Music</a></li>
    <li routerLinkActive="active"><a routerLink="/news"    (click)="close()">News</a></li>
    <li routerLinkActive="active"><a routerLink="/shop"    (click)="close()">Shop</a></li>
    <li routerLinkActive="active"><a routerLink="/contact" (click)="close()">Contact</a></li>
  </ul>

  <!-- HIGH CONTRAST TOGGLE -->
  <div class="hc-row">
    <span class="hc-label">High Contrast</span>
    <button class="hc-switch" [class.on]="theme.isHighContrast()" (click)="theme.toggle()"
            [attr.aria-pressed]="theme.isHighContrast()" aria-label="Toggle high contrast mode">
      <span class="hc-thumb"></span>
    </button>
  </div>

  <!-- MINI PLAYER -->
  <div class="mini-player">
    <div class="mini-player-label">Now Playing</div>
    <div class="mini-player-track">
      <div class="mini-player-art">
        <img [src]="audio.currentCover()" [alt]="audio.currentTitle()">
      </div>
      <div class="mini-player-info">
        <div class="mini-player-title">{{ audio.currentTitle() }}</div>
        <div class="mini-player-sub">{{ audio.currentAlbum() }}</div>
      </div>
    </div>
    <div class="mini-player-bar" (click)="onSeek($event)" title="{{ audio.currentTimeStr() }}">
      <div class="mini-player-progress" [style.width.%]="audio.progress() * 100"></div>
    </div>
    <div class="mini-player-controls">
      <div class="mini-ctrl" (click)="audio.prev()" title="Previous">
        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </div>
      <div class="mini-ctrl play" (click)="audio.toggle()" [title]="audio.isPlaying() ? 'Pause' : 'Play'">
        @if (audio.isPlaying()) {
          <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        } @else {
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        }
      </div>
      <div class="mini-ctrl" (click)="audio.next()" title="Next">
        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </div>
    </div>
  </div>

  <div class="nav-bottom">© 2025 Crimson Moonflare</div>
</nav>
